<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" />
  
  <!-- Subtle inner ambient circle glow -->
  <circle cx="32" cy="32" r="18" fill="#38bdf8" fill-opacity="0.12" />

  <!-- Letter N - Sharp, modern geometric typography -->
  <path 
    d="M 18 47 V 17 H 24.5 L 39.5 39.5 V 17 H 46 V 47 H 39.5 L 24.5 24.5 V 47 Z" 
    fill="url(#neonGlow)" 
    filter="url(#glow)"
  />

  <!-- Subtle corner accent dot -->
  <circle cx="48" cy="15" r="2" fill="#38bdf8" />
</svg>
